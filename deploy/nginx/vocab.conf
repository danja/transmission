# deploy/nginx/vocab.conf
#
# The Transmission vocabulary at https://hyperdata.it/xmlns/transmissions/, to
# be included inside the existing `server { server_name hyperdata.it; ... }`
# block, beside the one JigDAW already has there.
#
# http://purl.org/stuff/transmissions/ already redirects here, through the
# wildcard that maps purl.org/stuff/<name> to hyperdata.it/xmlns/<name>. Nothing
# was ever served at the other end, so every trn: IRI published by this project,
# by plugin-universe, by downspout and by JigDAW resolved to a 404. Serving these
# two files is the whole fix; no PURL administration is involved.
#
# Two decisions here are load bearing.
#
# A term answers 303, not 200. trn:PluginProfile denotes a class, not a
# document, and a 200 would assert that the class IS the page returned. A
# reasoner that conflates the two starts inferring that a class is a document.
#
# CORS, because a browser fetching the vocabulary cross-origin cannot read a
# response without it. JigDAW's host runs in a browser and dereferences these.

# The bare form, without the trailing slash. The namespace IRI has one and that
# is what appears in published data, but a person types the short form and the
# PURL passes through whatever it was given.
location = /xmlns/transmissions {
    return 301 /xmlns/transmissions/;
}

# The namespace IRI itself. Content negotiated, HTML by default so that pasting
# it into a browser shows something useful.
location = /xmlns/transmissions/ {
    root /home/github/transmission/deploy/vocab;

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options       "nosniff" always;

    # `if` is discouraged in a location, and is documented as safe with
    # `return` and `rewrite`, which is all it does here.
    #
    # ld+json is matched although only Turtle is served. A client that asks for
    # it is an RDF client, and Turtle correctly labelled is more use to it than
    # the HTML it would otherwise fall through to. It is not mislabelled: the
    # .ttl location below states what it actually is.
    if ($http_accept ~* "text/turtle|application/ld\+json|application/turtle") {
        rewrite ^ /xmlns/transmissions/transmissions.ttl last;
    }

    try_files /index.html =404;
}

# The Turtle document.
location = /xmlns/transmissions/transmissions.ttl {
    alias /home/github/transmission/deploy/vocab/transmissions.ttl;
    # .ttl is not in nginx's mime map. default_type rather than a `types` block,
    # which would replace the whole map for this location.
    default_type "text/turtle; charset=utf-8";

    add_header Access-Control-Allow-Origin  "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options       "nosniff" always;
}

# Every term. trn:PluginProfile, trn:accepts and the rest each get a 303 to the
# document that defines them. The pattern excludes anything with a dot, so the
# .ttl above is matched by its own exact location rather than swallowed here.
#
# Hyphens and slashes are included because the namespace carries more than
# terms. Transmission's saved projects bind the default prefix to it, so every
# patch node is minted here too: trn:harmonic-atlas is a node in one patch and
# trn:plugins/downspout/ambo is a plugin identity. Those are data rather than
# vocabulary and the document does not define them, but an IRI that has been
# published should resolve to the namespace rather than to a 404. See
# docs/namespace.md on why they are there at all.
location ~ ^/xmlns/transmissions/([A-Za-z][A-Za-z0-9_/-]*)$ {
    add_header Access-Control-Allow-Origin "*" always;
    return 303 https://hyperdata.it/xmlns/transmissions/;
}
